name: Chat mode clone proof (temporary)
on:
  push:
    branches: [tmp/chat-clone-proof-20260912]
    paths: [.github/workflows/tmp-chat-clone-proof.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone fixed public source and export without credentials
        shell: bash
        env:
          EXPECTED_COMMIT: a8c7a519280f57f33bcab512d3f0475533038bc5
          EXPECTED_TREE: 5fb594d85a8a20d763e949910f83f9aca14a1e99
        run: |
          set -euo pipefail
          git -c credential.helper= clone --no-checkout https://github.com/hrygo/hikmah.git "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          git checkout --detach "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-parse --is-shallow-repository)" = false
          git fsck --full
          mkdir -p "$RUNNER_TEMP/export" "$RUNNER_TEMP/export-tree"
          git update-ref refs/heads/export-base HEAD
          git bundle create "$RUNNER_TEMP/export/hikmah.bundle" refs/heads/export-base
          git bundle verify "$RUNNER_TEMP/export/hikmah.bundle"
          git checkout-index --all --prefix="$RUNNER_TEMP/export-tree/"
          tar -C "$RUNNER_TEMP/export-tree" -czf "$RUNNER_TEMP/export/source.tar.gz" .
          git ls-tree -r -z HEAD > "$RUNNER_TEMP/export/tree-manifest.z"
          git rev-parse HEAD > "$RUNNER_TEMP/export/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/export/tree.txt"
          git rev-list --count HEAD > "$RUNNER_TEMP/export/history-count.txt"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'export'
          raw = (out / 'tree-manifest.z').read_bytes()
          entries = []
          for row in raw.split(b'\0'):
              if not row:
                  continue
              meta, path = row.split(b'\t', 1)
              mode, kind, sha = meta.decode().split()
              entries.append({'path': os.fsdecode(path), 'mode': mode, 'type': kind, 'sha': sha})
          report = {
              'repository': 'hrygo/hikmah',
              'commit': (out / 'commit.txt').read_text().strip(),
              'tree': (out / 'tree.txt').read_text().strip(),
              'tracked_entries': len(entries),
              'gitlinks': sum(e['mode'] == '160000' for e in entries),
              'history_count': int((out / 'history-count.txt').read_text()),
              'history_scope': 'fixed commit and all its reachable ancestors',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'entries': entries,
          }
          (out / 'manifest.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps({k: v for k, v in report.items() if k != 'entries'}, ensure_ascii=False))
          PY
          cd "$RUNNER_TEMP/export"
          sha256sum hikmah.bundle source.tar.gz tree-manifest.z commit.txt tree.txt history-count.txt manifest.json > SHA256SUMS
      - name: Upload transfer package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hikmah-chat-clone-proof-a8c7a519
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
