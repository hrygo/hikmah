name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
    branches: [ main ]

# 2026 Best Practice: Principle of Least Privilege
permissions:
  contents: read
  pull-requests: read

# 2026 Best Practice: Concurrency control to automatically cancel stale runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-governance:
    name: PR Governance & Linked Issue Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR Title Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

      - name: Verify Linked Issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking for linked issue or bypass marker..."
          
          # Check for [skip-issue] bypass
          if echo "$PR_BODY $PR_TITLE" | grep -iE '\[skip-issue\]|\[skip issue\]'; then
            echo "✓ PR explicitly declared [skip-issue] marker. Skipping linked issue requirement."
            exit 0
          fi
          
          # Match standard issue reference patterns: #123, Fixes #123, Closes #123, Refs #123, etc.
          if echo "$PR_BODY" | grep -iE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved|ref|refs|issue|issues|tracking)\s*#\s*[0-9]+|#\s*[0-9]+'; then
            echo "✓ PR contains linked issue reference."
            exit 0
          fi
          
          echo "::error::PR must reference a linked Issue (e.g. 'Fixes #123', 'Closes #123', 'Refs #123' or '#123'). If this PR does not require an issue (e.g. minor typo/docs), include '[skip-issue]' in the PR description."
          exit 1

      - name: Verify PR Description Quality
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 20 ]; then
            echo "::error::PR description is empty or too short (< 20 characters). Please provide a meaningful summary and validation notes."
            exit 1
          fi
          echo "✓ PR description length check passed."

  backend:
    name: Backend Quality (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff (Lint & Format Check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Mypy (Strict Type Check)
        run: uv run mypy apps/api/src apps/api/tests

      - name: Run Pytest
        run: uv run pytest apps/api/tests -v --cov=hikmah

  frontend:
    name: Frontend Quality (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Approve dependency build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check (All Workspace Packages)
        run: pnpm run typecheck

      - name: Run Vitest Unit Tests
        run: pnpm run test

      - name: Build Web App & Packages
        run: pnpm run build
